name: vsomeip-demo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vsomeip-demo.yml'
      - 'vsomeip_demo/**'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git \
            libboost-dev libboost-system-dev libboost-filesystem-dev libboost-thread-dev libdbus-1-dev

      - name: Build & install vsomeip (3.7.6, no tests)
        run: |
          set -e -o pipefail
          exec > >(tee /tmp/vsomeip-build.log) 2>&1
          echo "== downloading vsomeip 3.7.6 (archive) =="
          curl -fsSL https://github.com/COVESA/vsomeip/archive/refs/tags/3.7.6.tar.gz -o /tmp/vsomeip.tgz
          mkdir -p /tmp/vsomeip-src
          tar -xzf /tmp/vsomeip.tgz -C /tmp/vsomeip-src --strip-components=1
          echo "== configuring vsomeip =="
          cmake -S /tmp/vsomeip-src -B /tmp/vsomeip-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SIGNAL_HANDLING=ON \
            -DDIAGNOSIS_ADDRESS=0x10 \
            -DCMAKE_INSTALL_PREFIX=/tmp/vsomeip/dist
          echo "== building vsomeip =="
          cmake --build /tmp/vsomeip-src/build -j"$(nproc)"
          echo "== installing vsomeip =="
          cmake --install /tmp/vsomeip-src/build
          touch /tmp/build_ok

      - name: Build demo (service + client)
        run: |
          set -e -o pipefail
          exec > >(tee /tmp/demo-build.log) 2>&1
          cmake -S vsomeip_demo -B vsomeip_demo/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/vsomeip/dist
          cmake --build vsomeip_demo/build -j"$(nproc)"
          touch /tmp/demo_ok

      - name: Run service + client
        working-directory: vsomeip_demo
        run: |
          export VSOMEIP_CONFIGURATION=$PWD/vsomeip.json
          ./build/service > /tmp/service.log 2>&1 &
          SVC=$!
          sleep 10
          timeout 30 ./build/client | tee /tmp/client.log
          kill $SVC 2>/dev/null || true
          echo "===== service.log ====="
          cat /tmp/service.log

      - name: Publish build failure log (debug)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/demo_ok ] && [ -s /tmp/demo-build.log ]; then
            { echo "## demo build failed (run ${{ github.run_id }}/${{ github.run_attempt }})"
              echo '```text'
              tail -c 30000 /tmp/demo-build.log
              echo '```'; } > /tmp/body.md
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "demo build debug (${{ github.run_id }}/${{ github.run_attempt }})" \
              --body-file /tmp/body.md
          elif [ ! -f /tmp/build_ok ] && [ -s /tmp/vsomeip-build.log ]; then
            { echo "## vsomeip build failed (run ${{ github.run_id }}/${{ github.run_attempt }})"
              echo '```text'
              tail -c 30000 /tmp/vsomeip-build.log
              echo '```'; } > /tmp/body.md
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "vsomeip build debug (${{ github.run_id }}/${{ github.run_attempt }})" \
              --body-file /tmp/body.md
          fi

      - name: Assert results
        run: |
          echo "===== client.log ====="
          cat /tmp/client.log
          grep -q "is available" /tmp/client.log || { echo "FAIL: availability"; exit 1; }
          grep -q "GetVersion" /tmp/client.log || { echo "FAIL: GetVersion"; exit 1; }
          grep -q "value=7" /tmp/client.log || { echo "FAIL: Add(3,4)"; exit 1; }
          grep -q "value=88" /tmp/client.log || { echo "FAIL: Speed=88"; exit 1; }
          grep -q "event 0x8001\|speed field" /tmp/client.log || { echo "FAIL: event"; exit 1; }
          echo "ALL CHECKS PASSED"