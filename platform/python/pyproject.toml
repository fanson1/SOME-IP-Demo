[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "someip"
version = "0.2.0"
description = "Self-developed production-grade SOME/IP stack (AUTOSAR flavor), Python implementation"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["someip", "someip.legacy"]